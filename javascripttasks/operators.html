<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("<h1>Unary operator</h1>")

        // post increment
        document.write("<h3>post increment</h3>")
        document.write("x=10","<br>")
        var x=10
        document.write("x++ : ",x++,"<br>")
        document.write(x)

        // pre increment
        document.write("<h3>pre increment</h3>")
        document.write("a=5","<br>")
        var a=5
        document.write("++a : ",++a,"<br>")
        document.write(a)

        // post decrement
        document.write("<h3>post decrement</h3>")
        document.write("b=5","<br>")
        var b=5
        document.write("x-- : ",x--,"<br>")
        document.write(b)

        // pre decrement
        document.write("<h3>pre decrement</h3>")
        document.write("c=6","<br>")
        var c=6
        document.write("--c : ",--c,"<br>")
        document.write(c)
    


    </script>
</body>
</html>
