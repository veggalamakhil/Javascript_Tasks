<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
    document.write("<h1>Arithmetic operators</h1>","<br>")
    var a=10
    var b=10
    document.write("Addition : ",a+b,"<br>")
    document.write("Subtraction : ",a-b,"<br>")
    document.write("Multiplication : ",a*b,"<br>")
    document.write("Division : ",a/b,"<br>")
    document.write("Modulus : ",a%b,"<br>")
    document.write("Exponentation : ",a**b)
    

    
    document.write("<h1>Relatinal  Operators</h1>","<br>")
    var a=5
    var b="6"
    document.write("Equality : ",a==5,"<br>")
    document.write("Strict Equality : ",a===b,"<br>")
    document.write("Greater than : ",a>b,"<br>")
    document.write("Lessthan : ",a<b,"<br>")
    document.write("greaterthan / eqaul : ",a>=b,"<br>")
    document.write("Lessthan / equal : ",a<=b,"<br>")
    document.write("Not equals : ",a!=b)
  

    document.write("<h1>Assignment Operators</h1>","<br>")
    var a=5
    var b=5
    document.write("add & assign : ",a+=b,"<br>")
    document.write("sub & assign : ",a-=b,"<br>")
    document.write("Mul & assign : ",a*=b,"<br>")
    document.write("Div & assign : ",a/=b,"<br>")
    document.write("Mod & assign : ",a%=b,"<br>")
    document.write("exp & assign : ",a**=b)



    document.write("<h1>Logical Operators</h1>","<br>")
    var a=5
    var b=5
    document.write("AND : ",a>1 && b>1,"<br>")
    document.write("OR : ",a<0 || b>0,"<br>")
    document.write("NOT : ",!(a==b))
   


    document.write("<h1>Bitwis Operators</h1>","<br>")
    var a=5
    var b=4
    document.write("Bitwise AND : ",a&b,"<br>")
    document.write("Bitwise OR : ",a|b,"<br>")
    document.write("Bitwise XOR : ",a^b,"<br>")
    document.write("Bitwise NOT : ",~a,"<br>")
    document.write("Left shift : ",a<<b,"<br>")
    document.write("Right shift : ",a>>b)
    </script>
</body>
</html>
